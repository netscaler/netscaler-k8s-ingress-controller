apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aigatewayprofiles.citrix.com
spec:
  group: citrix.com
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Status
        type: string
        description: "Current Status of the CRD"
        jsonPath: .status.state
      - name: Message
        type: string
        description: "Status Message"
        jsonPath: .status.status_message
      - name: Profile Type
        type: string
        description: "Type of AI Gateway Profile"
        jsonPath: .spec.config.profiletype
      - name: Endpoint Type
        type: string
        description: "Endpoint Type"
        jsonPath: .spec.config.endpointtype
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                state:
                  type: string
                status_message:
                  type: string
            spec:
              type: object
              required:
                - gatewayClassName
              x-kubernetes-validations:
                - rule: "has(self.preconfigured) != has(self.config)"
                  message: "preconfigured and config are mutually exclusive fields. Please specify exactly one of them."
              properties:
                gatewayClassName:
                  type: string
                  description: "Name of the GatewayClass that this AI Gateway profile should be applied to. The profile is applied only when this matches a GatewayClass managed by this controller."
                preconfigured:
                  type: string
                  description: "Mutually exclusive with 'config'. Name of a preconfigured, built-in AI Gateway profile on the NetScaler to use."
                config:
                  type: object
                  description: "Mutually exclusive with 'preconfigured'. Contains all the parameters related to the NetScaler Nitro API for a fully custom AI Gateway profile. Customers can specify any valid Nitro AI Gateway profile parameters."
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.profiletype) || !has(self.profiletype) || self.profiletype == oldSelf.profiletype"
                      message: "profiletype is immutable once set"
                    - rule: "!has(oldSelf.endpointtype) || !has(self.endpointtype) || self.endpointtype == oldSelf.endpointtype"
                      message: "endpointtype is immutable once set"
                    - rule: "!has(oldSelf.authtoken) || !has(self.authtoken) || self.authtoken == oldSelf.authtoken"
                      message: "authtoken is immutable once set"
                  properties:
                    profiletype:
                      type: string
                      description: "Type of AI Gateway profile: backend or frontend"
                      enum:
                        - backend
                        - frontend
                    endpointtype:
                      type: string
                      description: "Type of AI endpoint (e.g., azureopenai, openai, anthropic, etc.)"
                      enum:
                        - azureopenai
                    tokenquota:
                      type: integer
                      description: "Token quota limit for backend profiles. Only applicable when profiletype is 'backend'."
                      minimum: 0
                      maximum: 2147483647
                    quotarefreshfrequency:
                      type: integer
                      description: "Quota refresh rate, in minutes."
                      minimum: 1
                      maximum: 65535
                    authtoken:
                      type: object
                      description: "Authentication token/API Key for the AI GW Endpoint, sourced from a Kubernetes Secret."
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: "Name of the Kubernetes Secret object containing the auth token."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        namespace:
                          type: string
                          description: "Namespace of the Kubernetes Secret object. Defaults to the namespace of the AI Gateway Profile."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  additionalProperties: true
  scope: Namespaced
  names:
    plural: aigatewayprofiles
    singular: aigatewayprofile
    kind: aigatewayprofile
    shortNames:
    - aigwp
