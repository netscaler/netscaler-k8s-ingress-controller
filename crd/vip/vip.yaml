#Sample CRD instance

#apiVersion: citrix.com/v1
#description: VIP for apache service
#kind: vip
#metadata:
#  name: service-apache
#  namespace: default
#spec:
#  description: VIP for the apache Service
#  ipaddress: 10.99.98.90
#  kind: service
#  name: apache

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vips.citrix.com
spec:
  group: citrix.com
  names:
    kind: vip
    plural: vips
    singular: vip
  scope: Namespaced
  versions: 
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - jsonPath: .spec.ipaddress
      name: VIP
      type: string
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    - name: Status
      type: string
      description: "Current Status of the CRD"
      jsonPath: .status.state
    - name: Message
      type: string
      description: "Status Message"
      jsonPath: .status.status_message
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              state:
                type: string
              status_message:
                type: string
          spec:
            type: object
            properties:
              ipaddress:
                type: string
              name:
                type: string
              kind:
                type: string
                enum: ["service", "ingress", "listener", "gateway"]
              description:
                type: string
              range-name:
                type: string
              multicluster:
                description: "The setting of this indicates that the VIP/csvserver IP address is shared by multiple netscaler ingress controllers on the VPX/MPX. For CPX, this field is not applicable"
                type: boolean
              hostnames:
                description: "Hostnames associated with the VIP"
                type: array
                items:
                  type: string
