apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: globaltrafficpolicies.citrix.com
spec:
  group: citrix.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: globaltrafficpolicies
    # singular name to be used as an alias on the CLI and for display
    singular: globaltrafficpolicy
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: globaltrafficpolicy
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - gtp
  versions: 
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
      - name: Status
        type: string
        description: "Current Status of the CRD"
        jsonPath: .status.state
      - name: Message
        type: string
        description: "Status Message"
        jsonPath: .status.status_message 
    schema:
     # openAPIV3Schema is the schema for validating custom objects.
      openAPIV3Schema:
        type: object
        required: ["apiVersion","kind","metadata","spec"]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            #required: ["name","namespace"]
            properties:
              name:
                type: string
              #namespace:
              #  type: string
            type: object
          status:
            type: object
            properties:
              state:
                 type: string
              status_message:
                 type: string
          spec:
            required: ["serviceType","hosts"]
            properties:
              ipType:
                type: string
                enum:
                - ipv4
                description: "Type of address A or AAAA. Currently only A is supported"
              serviceType:
                type: string
                enum:
                - HTTP
                - SSL
                - TCP
                - UDP
                - ANY
                description: "Protocol supported in GSLB deployment"
              hosts:
                items:
                  required: ["host","policy"]
                  properties:
                    host:
                      type: string
                      description: "Domain for which GSLB support will be applied"
                    servicePort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: "Optional service port to monitor for a multi-port Service/Ingress/Gateway backend. When set, this port is used for the auto-generated GSE monitorPort (and hence the GSLB servicegroup member/monitor) instead of the first or derived port. Absent keeps the existing behaviour."
                    ingressHostName:
                      type: string
                      description: "Optional hostname to match against ingress hostname records. If not specified, the 'host' field is used for matching."
                    routeHostName:
                      type: string
                      description: "Optional selector matched against Gateway API Route/listener hostnames. Falls back to host. Selection and validation only; 'host' remains the GSLB domain."
                    hostNameValidation:
                      type: string
                      enum:
                      - Strict
                      - Warn
                      - Ignore
                      description: "Behaviour when the effective Route/listener hostname set does not cover this GTP host. Absent is treated as Strict (matches the current Ingress path). Warn/Ignore relax the check for the owning GTP only."
                    gatewayRef:
                      type: object
                      description: "Optional pin to a specific Gateway (and listener via sectionName) whose port and hostname are used."
                      properties:
                        group:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        sectionName:
                          type: string
                    routeRef:
                      type: object
                      description: "Optional pin to a specific Gateway API Route."
                      properties:
                        group:
                          type: string
                        kind:
                          type: string
                          enum:
                          - HTTPRoute
                          - GRPCRoute
                          - TLSRoute
                          - TCPRoute
                          - UDPRoute
                        name:
                          type: string
                        namespace:
                          type: string
                    policy:
                      required: ["targets","trafficPolicy"]
                      properties:
                        trafficPolicy:
                          type: string
                          enum:
                          - LOCAL-FIRST
                          - CANARY
                          - FAILOVER
                          - RTT
                          - ROUNDROBIN
                          - STATICPROXIMITY
                          description: "The traffic distribution policy supported in GSLB deployment"
                        sourceIpPersistenceId:
                          type: integer
                          minimum: 0
                          maximum: 65535
                          multipleOf : 100
                          description: "Unique SourceIP persistence ID. This enables persistence based on the source IP address for inbound packets"
                        secLbMethod:
                          type: string
                          description: "The traffic distribution policy supported among clusters under a group in local-first, canary or failover"
                        multipleIPResponse:
                          type: string
                          enum:
                          - ENABLED
                          - DISABLED
                          description: "When ENABLED, the GSLB vserver responds with multiple IP addresses in a single DNS response (Multiple IP Response / MIR). Optional."
                        emptyDownResponse:
                          type: string
                          enum:
                          - ENABLED
                          - DISABLED
                          description: "When ENABLED, the GSLB vserver returns an empty response if all the bound GSLB services are DOWN (Empty Down Response / EDR). Optional."
                        targets:
                          items:
                            required: ["destination"]
                            properties:
                              destination:
                                type: string
                                description: "Ingress or LoadBalancer service endpoint in each cluster"
                              weight:
                                type: integer
                                minimum: 0 
                                maximum: 100
                                description: "Proportion of traffic to be maintained across clusters. For canary proportion is percentage"
                              rule: 
                                type: string
                              CIDR:
                                type: string
                                description: "CIDR to be used in local-first to determine the scope of locality"
                              primary:
                                type: boolean
                                description: "Is this destination a primary cluster or a backup cluster in failover deployment. Possible values: True or False"
                            type: object
                          type: array
                        monitor:
                          items:
                            properties:
                              monType: 
                                type: string
                                enum:
                                - PING
                                - TCP
                                - HTTP
                                - HTTPS
                                - ping
                                - tcp
                                - http
                                - https
                                description: "Type of probe to determine the health of GSLB endpoint"
                              uri:
                                type: string
                                description: "Path to be probed for the health of GSLB endpoint in case of http and https"
                              destinationPort:
                                type: integer
                                minimum: 0
                                maximum: 65535
                                description: "Destination port for monitoring"
                              sni:
                                type: boolean
                              commonName:
                                type: string
                              customHeader:
                                type: string
                                description: "Custom header for monitoring"
                              respCode:
                                x-kubernetes-int-or-string: true
                                anyOf:
                                  - type: integer
                                  - type: string  
                                description: "Response code expected to mark the GSLB endpoint healthy in case of http and https"
                              sslProfile:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                                description: "SSL profile parameters to apply to the backend SSL profile of an https monitor. Any parameter of the NetScaler SSL profile can be given, for example tls13 or sessReuse. The name and sslProfileType parameters are owned by the controller and are ignored if given"
                              ciphers:
                                type: array
                                minItems: 1
                                description: "List of ciphers to be bound to the SSL profile of an https monitor. A cipher suite, predefined cipher group or user created cipher group can be mentioned. If not given, the NetScaler default DEFAULT_BACKEND cipher group applies"
                                items:
                                  type: string
                                  description: "Cipher suite or cipher group name"
                              interval: {type: integer}
                              intervalUnits: {type: string, enum: [SEC, MSEC, MIN]}
                              respTimeout: {type: integer}
                              respTimeoutUnits: {type: string, enum: [SEC, MSEC, MIN]}
                              downTime: {type: integer}
                              downTimeUnits: {type: string, enum: [SEC, MSEC, MIN]}
                              retries: {type: integer}
                              failureRetries: {type: integer}
                              successRetries: {type: integer}
                              deviation: {type: integer}
                              deviationUnits: {type: string, enum: [SEC, MSEC, MIN]}
                              reverse: {type: boolean}
                              secure: {type: boolean}
                              lrtm: {type: boolean}
                              netProfile: {type: string, maxLength: 127}
                              monState: {type: boolean}
                              advancedOptions:
                                type: object
                                maxProperties: 32
                                additionalProperties: {type: string, maxLength: 256}
                            type: object
                          type: array
                      type: object
                  type: object
                type: array
              status:
                type: object
            type: object
